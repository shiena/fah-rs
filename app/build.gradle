plugins { id 'com.android.application' }
android {
    namespace 'dev.fah.android'
    compileSdk 36
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'dev.fah.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
