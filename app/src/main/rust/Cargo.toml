[package]
name = "fah-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[lib]
name = "fah_rust"
crate-type = ["staticlib", "rlib"]

[features]
native-runtime = []

[dependencies]
serde_json = "1"
fah-core = { path = "../../../../crates/fah-core" }
fah-ncnn = { path = "../../../../crates/fah-ncnn" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
