[package]
name = "fah-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "fah_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
fah-api = { path = "../fah-api" }
fah-application = { path = "../fah-application" }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
fah-windows = { path = "../../windows", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
fah-apple-platform = { path = "../fah-apple-platform" }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
fah-ncnn = { path = "../fah-ncnn" }

[target.'cfg(target_os = "linux")'.dependencies]
fah-linux-platform = { path = "../fah-linux-platform" }
