[package]
name = "fah-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
default = ["desktop"]
desktop = ["dep:fah-gui"]

[[bin]]
name = "fah-windows"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
fah-core = { path = "../crates/fah-core" }
fah-api = { path = "../crates/fah-api" }
fah-application = { path = "../crates/fah-application" }
fah-input = { path = "../crates/fah-input" }
fah-ncnn = { path = "../crates/fah-ncnn" }
fah-gui = { path = "../crates/fah-gui", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde_json = "1"
anyhow = "1"
ort-sys = { version = "=2.0.0-rc.10", features = ["disable-linking"] }
libloading = "0.8"
