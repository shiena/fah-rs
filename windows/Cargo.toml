[package]
name = "fah-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
fah-native = { path = "../app/src/main/rust", features = ["native-runtime"] }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde_json = "1"
anyhow = "1"
ort-sys = { version = "=2.0.0-rc.10", features = ["disable-linking"] }
libloading = "0.8"

[profile.release]
opt-level = 3
